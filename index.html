<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>방이중 골 때리는 런치리그</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 모바일 우선 단일 컬럼. 상단 대회 타이틀 → 탭(일정·결과 / 관리자) → 리그 칩 → 조별 순위표 → 경기 카드 */
:root{
  --bg:#f3f5f8;--panel:#fff;--panel2:#eef1f6;--ink:#141a28;--mute:#667088;--line:#dde2ec;
  --accent:#d6204f;--accent-ink:#fff;--good:#14804a;--warn:#b86e00;--gold:#c99700;
  --f-display:"Black Han Sans","Noto Sans KR",sans-serif;--f-body:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1220;--panel:#141c2e;--panel2:#1b2540;--ink:#eaeef8;--mute:#8e99b5;--line:#243050;
  --accent:#ff4b78;--accent-ink:#1a0610;--good:#4cd48c;--warn:#f0a63a;--gold:#f5c542;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1220;--panel:#141c2e;--panel2:#1b2540;--ink:#eaeef8;--mute:#8e99b5;--line:#243050;
  --accent:#ff4b78;--accent-ink:#1a0610;--good:#4cd48c;--warn:#f0a63a;--gold:#f5c542;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:860px;margin:0 auto}
header{padding-block:26px 14px}
header .eyebrow{color:var(--accent);font-weight:700;font-size:12px;letter-spacing:.08em}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,6vw,34px);line-height:1.2;margin:4px 0 6px;text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
.sync{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}.dot.on{background:var(--good)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-block:10px}
.tabs button{font:inherit;font-weight:700;padding:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-block:6px 12px}
.chip{font:inherit;font-weight:500;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips.sub .chip{border-radius:8px;padding:8px 14px}
.chip small{color:var(--mute);margin-left:4px}.chip[aria-pressed=true] small{color:inherit;opacity:.7}
h2{font-size:16px;margin:22px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2 .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--panel2);color:var(--mute)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:480px;font-variant-numeric:tabular-nums}
th,td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th{font-size:11px;color:var(--mute);font-weight:500}
td.team,th.team{text-align:left;white-space:normal;min-width:150px}
.cls{display:block;font-size:11px;color:var(--mute)}
tr.adv td{background:color-mix(in srgb,var(--accent) 9%,transparent)}
tr.adv td:first-child{box-shadow:inset 3px 0 var(--accent)}
td.pts{font-weight:700;font-size:15px}
.note{font-size:12px;color:var(--mute);margin-top:6px}
.warn{color:var(--warn);font-weight:700}
.day{font-size:12px;font-weight:700;color:var(--mute);margin:16px 0 6px}
.match{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.mmeta{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--mute);margin-bottom:6px}
.mmeta b{color:var(--accent)}
.mrow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.mrow .t{min-width:0;overflow-wrap:anywhere;font-weight:500}.mrow .t:last-child{text-align:right}
.mrow .t.w{font-weight:700}.mrow .t.ph{color:var(--mute);font-weight:400}
.sc{font-family:var(--f-display);font-size:22px;min-width:76px;text-align:center;font-variant-numeric:tabular-nums}
.sc.pre{font-family:var(--f-body);font-size:12px;color:var(--mute)}
.pk{font-size:11px;color:var(--mute);text-align:center;margin-top:2px}
.badge{font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--panel2);color:var(--mute)}
.badge.done{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-block:10px}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid .full{grid-column:1/-1}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{font:inherit;font-weight:700;padding:10px 16px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dng{color:var(--accent);background:transparent;border-color:var(--accent)}
.score-in{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.score-in input{text-align:center;font-size:22px;font-weight:700}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:9;max-width:90vw}
.empty{color:var(--mute);padding:18px;text-align:center}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal[hidden]{display:none}
.mbox{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:24px 22px 20px;max-width:340px;width:100%;text-align:center}
.mic{font-size:36px;line-height:1}.mbox h3{margin:10px 0 4px;font-size:18px}.mbox p{margin:0 0 16px;color:var(--mute)}
.mbox .btn{width:100%}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">방이중학교 · 점심시간 학급 스포츠 리그</div>
    <h1>2026학년도 방이중학교<br><em>골(Goal) 때리는</em> 런치리그</h1>

 {id:"ym",name:"열매 리그",sport:"축구",groups:{A:["3학년 2반 기술은정태승FC","2학년 5반 네이마르말고 내 이마에","3학년 4반 샤승FC","2학년 6반 FC UFC","3학년 5반 광견FC"],B:["2학년 2반 은찬아 사랑해","2학년 3반 서울의아들정환석","2학년 4반 너와 나의 거리는 10 pc","3학년 1반 티원","3학년 3반 김용찬의 아이들"]},adv:2}

["rb",3,"g","A","2026-10-09","12:55~13:10","풋살장","3학년 5반 수학은 연진영","1학년 3반 FC효자손"],
["rb",4,"g","B","2026-10-09","12:55~13:10","풋살장","1학년 1반 3☆fc","3학년 1반 줴줴이야"],
["rb",5,"g","B","2026-10-09","12:55~13:10","풋살장","3학년 1반 줴줴이야","3학년 4반 우주최강변우주FC"],
["rb",6,"g","B","2026-10-09","12:55~13:10","풋살장","3학년 4반 우주최강변우주FC","1학년 1반 3☆fc"],
["rb",7,"k","준결승","2026-10-09","12:55~13:10","풋살장","A조 1위","B조 2위"],
["rb",8,"k","준결승","2026-10-09","12:55~13:10","풋살장","A조 2위","B조 1위"],
["rb",9,"k","결승","2026-10-09","12:55~13:10","풋살장","7경기 승자","8경기 승자"],
["ss",1,"g","전체","2026-10-08","12:35~12:50","풋살장","1학년 2반 ☆우주@정복☆","1학년 3반 효자손 유나이티드"],
["ss",2,"g","전체","2026-10-08","12:35~12:50","풋살장","1학년 3반 효자손 유나이티드","1학년 4반 FC모바일"],
["ss",3,"g","전체","2026-10-08","12:35~12:50","풋살장","1학년 1반 슈팅스타","1학년 2반 ☆우주@정복☆"],
["ss",4,"g","전체","2026-10-08","12:35~12:50","풋살장","1학년 4반 FC모바일","1학년 5반 뽀롱뽀롱FC"],
["ss",5,"g","전체","2026-10-08","12:35~12:50","풋살장","1학년 5반 뽀롱뽀롱FC","1학년 1반 슈팅스타"],
["ss",6,"k","준결승","2026-10-08","12:35~12:50","풋살장","새싹 리그 1위","새싹 리그 4위"],
["ss",7,"k","준결승","2026-10-08","12:35~12:50","풋살장","새싹 리그 2위","새싹 리그 3위"],
["ss",8,"k","결승","2026-10-08","12:35~12:50","풋살장","6경기 승리 학급","7경기 승리 학급"],
["ym",1,"g","A","2026-10-14","12:50~13:10","축구장","3학년 2반 기술은정태승FC","2학년 5반 네이마르말고 내 이마에"],
["ym",2,"g","A","2026-10-14","12:50~13:10","축구장","3학년 4반 샤승FC","2학년 6반 FC UFC"],
["ym",3,"g","A","2026-10-14","12:50~13:10","축구장","3학년 5반 광견FC","3학년 2반 기술은정태승FC"],
["ym",4,"g","A","2026-10-14","12:50~13:10","축구장","2학년 5반 네이마르말고 내 이마에","3학년 4반 샤승FC"],
["ym",5,"g","A","2026-10-14","12:50~13:10","축구장","2학년 6반 FC UFC","3학년 5반 광견FC"],
["ym",6,"g","B","2026-10-14","12:50~13:10","축구장","2학년 2반 은찬아 사랑해","2학년 3반 서울의아들정환석"],
["ym",7,"g","B","2026-10-14","12:50~13:10","축구장","2학년 4반 너와 나의 거리는 10 pc","3학년 1반 티원"],
["ym",8,"g","B","2026-10-14","12:50~13:10","축구장","3학년 3반 김용찬의 아이들","2학년 2반 은찬아 사랑해"],
["ym",9,"g","B","2026-10-14","12:50~13:10","축구장","2학년 3반 서울의아들정환석","2학년 4반 너와 나의 거리는 10 pc"],
["ym",10,"g","B","2026-10-14","12:50~13:10","축구장","3학년 1반 티원","3학년 3반 김용찬의 아이들"],
["ym",11,"k","준결승","2026-10-14","12:50~13:10","축구장","A조 1위","B조 2위"],
["ym",12,"k","준결승","2026-10-14","12:50~13:10","축구장","A조 2위","B조 1위"],
["ym",13,"k","결승","2026-10-14","12:50~13:10","축구장","11경기 승자","12경기 승자"]
];
function defaults(){
  return {v:1,matches:RAW.map(r=>({id:r[0]+"-"+r[1],lg:r[0],seq:r[1],st:r[2],grp:r[3],date:r[4],time:r[5],place:r[6],t1:r[7],t2:r[8],s1:"",s2:"",p1:"",p2:"",done:false})),pkRank:{}};
}

/* ============ 상태 / 저장 (Firebase Realtime Database) ============ */
const CFG=window.FIREBASE_CONFIG||{};
let S=defaults(),adminOn=false,selLg="rb",selSub="",selId=null,tab="pub",rdb=null,auth=null,fbOK=false;
try{const u=JSON.parse(sessionStorage.getItem("ui")||"{}");selLg=u.lg||selLg;selSub=u.sub||"";selId=u.id||null;tab=u.tab||"pub"}catch(e){}
function saveUi(){try{sessionStorage.setItem("ui",JSON.stringify({lg:selLg,sub:selSub,id:selId,tab}))}catch(e){}}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lg=id=>LEAGUES.find(l=>l.id===id);
function toast(t){const e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,3200)}
function modal(title,msg,kind){
  $("mIc").textContent=kind==="ok"?"✅":"⚠️";$("mT").textContent=title;$("mM").textContent=msg;
  $("modal").hidden=false;$("mOk").focus();
}
$("mOk").onclick=()=>{$("modal").hidden=true};
$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").hidden=true};
function setSync(){
  const d=$("dot"),t=$("syncTxt");
  if(!rdb){d.className="dot";t.textContent="서버 설정(firebase-config.js)이 필요합니다";return}
  d.className="dot"+(fbOK?" on":"");
  if(!fbOK){t.textContent="서버에 연결하는 중…";return}
  const a=S.at?new Date(S.at):null;
  t.textContent="실시간 연결됨"+(a?` · 마지막 갱신 ${a.getMonth()+1}/${a.getDate()} ${String(a.getHours()).padStart(2,"0")}:${String(a.getMinutes()).padStart(2,"0")}`:"");
}
async function persist(){
  if(!rdb){modal("저장하지 못했습니다","서버 설정이 되어 있지 않습니다. firebase-config.js를 확인하세요.","err");return false}
  S.at=Date.now();
  try{await rdb.ref("state").set({json:JSON.stringify(S),at:S.at});return true}
  catch(e){modal("저장하지 못했습니다",e&&/permission/i.test(e.message||"")?"관리자 로그인이 풀렸습니다. 다시 로그인한 뒤 저장하세요.":"네트워크를 확인하고 다시 시도하세요.","err");return false}
}
function initFirebase(){
  if(!CFG.apiKey||!window.firebase){setSync();return}
  firebase.initializeApp(CFG);rdb=firebase.database();auth=firebase.auth();setSync();
  rdb.ref("state").on("value",snap=>{
    const v=snap.val();fbOK=true;
    if(v&&v.json){try{S=JSON.parse(v.json)}catch(e){}}
    setSync();renderPub();refreshSel();
  },()=>{fbOK=false;setSync()});
  auth.onAuthStateChanged(u=>{adminOn=!!u;if(tab==="adm")renderAdm()});
}

/* ============ 계산 ============ */
const cls=t=>{const m=/^(\d학년 \d반)\s*(.*)$/.exec(t||"");return m?{c:m[1],n:m[2]}:{c:"",n:t||""}};
const teamHTML=t=>{const x=cls(t);return x.c?`<b>${esc(x.n)}</b><span class="cls">${esc(x.c)}</span>`:`<b>${esc(x.n)}</b>`};
const isNum=v=>v!==""&&v!==null&&v!==undefined&&!isNaN(+v);
const played=m=>m.done&&isNum(m.s1)&&isNum(m.s2);

function table(lid,g){
  const L=lg(lid),names=L.groups[g];
  const R=Object.fromEntries(names.map(n=>[n,{t:n,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}]));
  const ms=S.matches.filter(m=>m.lg===lid&&m.st==="g"&&m.grp===g);
  ms.filter(played).forEach(m=>{
    const a=R[m.t1],b=R[m.t2];if(!a||!b)return;
    const x=+m.s1,y=+m.s2;a.p++;b.p++;a.gf+=x;a.ga+=y;b.gf+=y;b.ga+=x;
    if(x>y){a.w++;b.l++;a.pts+=3}else if(y>x){b.w++;a.l++;b.pts+=3}else{a.d++;b.d++;a.pts++;b.pts++}
  });
  const rows=Object.values(R);rows.forEach(r=>r.gd=r.gf-r.ga);
  // 1) 승점 2) 득실차 3) 승자승 4) 승부차기
  const key=r=>r.pts*1e4+r.gd;
  rows.sort((a,b)=>b.pts-a.pts||b.gd-a.gd);
  const out=[];
  for(let i=0;i<rows.length;){
    let j=i;while(j<rows.length&&key(rows[j])===key(rows[i]))j++;
    let grp=rows.slice(i,j);
    if(grp.length>1){
      const set=new Set(grp.map(r=>r.t));
      grp.forEach(r=>r.h2h=0);
      ms.filter(played).filter(m=>set.has(m.t1)&&set.has(m.t2)).forEach(m=>{
        const a=grp.find(r=>r.t===m.t1),b=grp.find(r=>r.t===m.t2),x=+m.s1,y=+m.s2;
        if(x>y)a.h2h+=3;else if(y>x)b.h2h+=3;else{a.h2h++;b.h2h++}
      });
      grp.sort((a,b)=>b.h2h-a.h2h);
      for(let k=0;k<grp.length;){
        let e=k;while(e<grp.length&&grp[e].h2h===grp[k].h2h)e++;
        const sub=grp.slice(k,e);
        if(sub.length>1){
          const pr=r=>isNum(S.pkRank?.[lid+"|"+r.t])?+S.pkRank[lid+"|"+r.t]:null;
          const anyPk=sub.every(r=>pr(r)!==null);
          sub.sort((a,b)=>(pr(a)??99)-(pr(b)??99));
          sub.forEach(r=>r.tie=!anyPk||new Set(sub.map(pr)).size<sub.length);
        }
        k=e;
      }
    }
    out.push(...grp);i=j;
  }
  const complete=ms.length>0&&ms.every(played);
  return {rows:out,complete,ties:out.some(r=>r.tie)};
}
function overall(lid){ // 단일 조 리그
  const g=Object.keys(lg(lid).groups)[0];return table(lid,g);
}
function resolve(m,name){
  let x;
  if((x=/^([A-Z])조 (\d)위$/.exec(name))){
    const t=table(m.lg,x[1]);const r=t.rows[+x[2]-1];
    return t.complete&&r&&!t.ties?r.t:null;
  }
  if((x=/^(.+ 리그) (\d)위$/.exec(name))){
    const t=overall(m.lg);return t.complete&&!t.ties?t.rows[+x[2]-1]?.t:null;
  }
  if((x=/^(\d+)경기 (승자|승리 학급)$/.exec(name))){
    const s=S.matches.find(q=>q.lg===m.lg&&q.seq===+x[1]);return s?winner(s):null;
  }
  return name;
}
function side(m,n){const raw=n===1?m.t1:m.t2;const r=resolve(m,raw);return {name:r||raw,ph:!r,known:!!r}}
function winner(m){
  if(!played(m))return null;
  const a=resolve(m,m.t1),b=resolve(m,m.t2);if(!a||!b)return null;
  if(+m.s1>+m.s2)return a;if(+m.s2>+m.s1)return b;
  if(isNum(m.p1)&&isNum(m.p2)&&+m.p1!==+m.p2)return +m.p1>+m.p2?a:b;
  return null;
}

/* ============ 공개 화면 ============ */
const fmtDate=d=>{const t=new Date(d+"T00:00:00");return `${t.getMonth()+1}월 ${t.getDate()}일 (${"일월화수목금토"[t.getDay()]})`};
function matchHTML(m){
  const a=resolve(m,m.t1),b=resolve(m,m.t2),w=winner(m),pl=played(m);
  const cell=(raw,res,win)=>`<div class="t ${win?"w":""} ${res?"":"ph"}">${res?teamHTML(res):esc(raw)}</div>`;
  const pk=pl&&+m.s1===+m.s2&&isNum(m.p1)&&isNum(m.p2)?`<div class="pk">승부차기 ${m.p1} : ${m.p2}</div>`:"";
  return `<div class="match"><div class="mmeta"><b>${esc(m.st==="g"?"조별 "+m.grp+(m.grp==="전체"?"":"조"):m.grp)}</b><span>${m.seq}경기</span><span>${esc(m.time)}</span><span>${esc(m.place)}</span><span class="badge ${m.done?"done":""}">${m.done?"종료":"예정"}</span></div>
  <div class="mrow">${cell(m.t1,a,w&&w===a)}<div class="sc ${pl?"":"pre"}">${pl?`${+m.s1} : ${+m.s2}`:"vs"}</div>${cell(m.t2,b,w&&w===b)}</div>${pk}</div>`;
}
function tableHTML(lid,g){
  const L=lg(lid),t=table(lid,g);
  const rows=t.rows.map((r,i)=>`<tr class="${i<L.adv&&t.complete&&!t.ties?"adv":""}">
   <td>${i+1}</td><td class="team">${teamHTML(r.t)}${r.tie?'<span class="warn">승부차기 필요</span>':""}</td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf}</td><td>${r.ga}</td><td>${r.gd>0?"+":""}${r.gd}</td><td class="pts">${r.pts}</td></tr>`).join("");
  return `<h2>${g==="전체"?"실시간 순위표":g+"조 순위표"}<span class="tag">${t.complete?"조별 경기 종료":"진행 중"}</span></h2>
  <div class="scroll"><table><thead><tr><th>순위</th><th class="team">학급 / 팀</th><th>경기</th><th>승</th><th>무</th><th>패</th><th>득점</th><th>실점</th><th>득실</th><th>승점</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function renderPub(){
  const el=$("pub");
  const chips=LEAGUES.map(l=>{const ms=S.matches.filter(m=>m.lg===l.id);return `<button class="chip" data-lg="${l.id}" aria-pressed="${l.id===selLg}">${l.name}<small>${l.sport} · ${ms.filter(m=>m.done).length}/${ms.length}</small></button>`}).join("");
  const L=lg(selLg),gs=Object.keys(L.groups),subs=[...gs,"본선"];
  if(!subs.includes(selSub))selSub=gs[0];
  const label=s=>s==="본선"?"본선 토너먼트":s==="전체"?"조별 리그":s+"조";
  const cnt=s=>{const ms=S.matches.filter(m=>m.lg===selLg&&(s==="본선"?m.st==="k":m.st==="g"&&m.grp===s));return `${ms.filter(m=>m.done).length}/${ms.length}`};
  const subHTML=`<div class="chips sub" role="tablist">${subs.map(s=>`<button class="chip" role="tab" data-sub="${esc(s)}" aria-pressed="${s===selSub}">${label(s)}<small>${cnt(s)}</small></button>`).join("")}</div>`;
  const ms=S.matches.filter(m=>m.lg===selLg&&(selSub==="본선"?m.st==="k":m.st==="g"&&m.grp===selSub)).sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time)||a.seq-b.seq);
  let h=`<div class="chips">${chips}</div>${subHTML}`;
  if(selSub!=="본선"){
    h+=tableHTML(selLg,selSub);
    h+=`<p class="note">승점 승 3 · 무 1 · 패 0 → 동률이면 득실차 → 승자승 → 승부차기 순으로 순위를 정합니다. 강조 표시는 본선 진출권입니다.</p>`;
    h+=`<h2>${label(selSub)} 경기 결과</h2>`;
  }else h+=`<h2>${L.name} 본선 <span class="tag">조별 순위 확정 후 자동 배정</span></h2>`;
  let cur="";
  ms.forEach(m=>{const d=m.date;if(d!==cur){cur=d;h+=`<div class="day">${fmtDate(d)}</div>`}h+=matchHTML(m)});
  if(!ms.length)h+=`<div class="empty">등록된 경기가 없습니다.</div>`;
  el.innerHTML=h;
}
$("pub").addEventListener("click",e=>{
  const b=e.target.closest("[data-lg]"),s=e.target.closest("[data-sub]");
  if(b){selLg=b.dataset.lg;selSub="";saveUi();renderPub()}
  else if(s){selSub=s.dataset.sub;saveUi();renderPub()}
});

/* ============ 관리자 화면 ============ */
function optLabel(m){const a=resolve(m,m.t1)||m.t1,b=resolve(m,m.t2)||m.t2;
  return `[${lg(m.lg).name}] ${m.seq}경기 · ${m.date.slice(5).replace("-","/")} · ${m.st==="g"?m.grp+(m.grp==="전체"?"":"조"):m.grp} · ${a} vs ${b}${m.done?" ✔":""}`}
function renderAdm(){
  const el=$("adm");
  if(!adminOn){
    el.innerHTML=`<div class="card"><h2 style="margin-top:0">관리자 로그인</h2><label for="pw">비밀번호</label>
    <input id="pw" type="password" autocomplete="off"><div class="btns"><button class="btn pri" id="login">로그인</button></div></div>`;
    $("login").onclick=login;$("pw").onkeydown=e=>{if(e.key==="Enter")login()};return;
  }
  el.innerHTML=`<div class="card"><h2 style="margin-top:0">경기 선택</h2>
   <div class="grid"><div><label for="fLg">리그</label><select id="fLg"><option value="">전체 리그</option>${LEAGUES.map(l=>`<option value="${l.id}">${l.name}</option>`).join("")}</select></div>
   <div><label for="fq">검색 (학급·팀명·날짜)</label><input id="fq" placeholder="예: 3학년 5반, 광견, 10/14"></div>
   <div class="full"><label for="sel">경기 일정 (드롭다운에서 선택)</label><select id="sel"></select></div></div></div>
   <div id="editor"></div>
   <div class="card"><div class="btns" style="margin:0"><button class="btn" id="addM">+ 경기 추가</button><button class="btn dng" id="resetAll">전체 초기화 (엑셀 기본 일정)</button><button class="btn" id="logout">로그아웃</button></div></div>
   <div id="pkBox"></div>`;
  $("fLg").onchange=refreshSel;$("fq").oninput=refreshSel;
  $("sel").onchange=()=>{selId=$("sel").value;saveUi();renderEditor()};
  $("addM").onclick=addMatch;
  $("resetAll").onclick=()=>{if($("resetAll").dataset.s){S=defaults();selId=null;commit("기본 일정으로 초기화했습니다.")}else{$("resetAll").dataset.s=1;$("resetAll").textContent="정말 초기화? 한 번 더 누르면 모든 결과가 삭제됩니다"}};
  $("logout").onclick=()=>{auth&&auth.signOut()};
  refreshSel();renderEditor();renderPk();
}
async function login(){
  const pw=$("pw").value;
  if(!auth){modal("설정이 필요합니다","firebase-config.js에 Firebase 설정값을 입력하세요.","err");return}
  try{await auth.signInWithEmailAndPassword(window.ADMIN_EMAIL,pw)}
  catch(e){toast("비밀번호가 올바르지 않습니다.");$("pw").value=""}
}
function refreshSel(){
  const s=$("sel");if(!s||!adminOn)return;
  const l=$("fLg").value,q=$("fq").value.trim().toLowerCase();
  const list=S.matches.filter(m=>(!l||m.lg===l)).filter(m=>!q||(optLabel(m)+m.t1+m.t2).toLowerCase().includes(q))
    .sort((a,b)=>LEAGUES.findIndex(x=>x.id===a.lg)-LEAGUES.findIndex(x=>x.id===b.lg)||a.seq-b.seq);
  s.innerHTML=`<option value="">— 경기를 선택하세요 (${list.length}경기) —</option>`+list.map(m=>`<option value="${m.id}" ${m.id===selId?"selected":""}>${esc(optLabel(m))}</option>`).join("");
}
function renderEditor(){
  const box=$("editor");const m=S.matches.find(x=>x.id===selId);
  if(!m){box.innerHTML=`<div class="card empty">위에서 경기를 선택하면 일정 수정과 결과 입력 창이 열립니다.</div>`;return}
  const L=lg(m.lg),all=[...new Set(Object.values(L.groups).flat())];
  const ph=["A조 1위","A조 2위","B조 1위","B조 2위",...S.matches.filter(x=>x.lg===m.lg&&x.st==="k").map(x=>x.seq+"경기 승자")];
  const dl=[...all,...ph].map(v=>`<option value="${esc(v)}">`).join("");
  box.innerHTML=`<div class="card"><h2 style="margin-top:0">${L.name} · ${m.seq}경기 <span class="tag">${m.st==="g"?"조별리그":"토너먼트"}</span></h2>
  <datalist id="dl">${dl}</datalist>
  <div class="grid">
   <div><label for="eDate">날짜</label><input id="eDate" type="date" value="${m.date}"></div>
   <div><label for="eTime">시간</label><input id="eTime" value="${esc(m.time)}"></div>
   <div><label for="ePlace">장소</label><input id="ePlace" value="${esc(m.place)}"></div>
   <div><label for="eGrp">조 / 단계</label><input id="eGrp" value="${esc(m.grp)}"></div>
   <div><label for="eT1">학급/팀 1</label><input id="eT1" list="dl" value="${esc(m.t1)}"></div>
   <div><label for="eT2">학급/팀 2</label><input id="eT2" list="dl" value="${esc(m.t2)}"></div>
  </div>
  <h3 style="font-size:13px;margin:16px 0 6px">결과 입력</h3>
  <div class="score-in"><div><label for="eS1">${esc(cls(resolve(m,m.t1)||m.t1).n||"팀1")} 득점</label><input id="eS1" type="number" min="0" inputmode="numeric" value="${m.s1}"></div><b>:</b>
   <div><label for="eS2">${esc(cls(resolve(m,m.t2)||m.t2).n||"팀2")} 득점</label><input id="eS2" type="number" min="0" inputmode="numeric" value="${m.s2}"></div></div>
  ${m.st==="k"?`<div class="score-in" style="margin-top:8px"><div><label for="eP1">승부차기 (동점일 때) 팀1</label><input id="eP1" type="number" min="0" value="${m.p1}"></div><b>:</b><div><label for="eP2">팀2</label><input id="eP2" type="number" min="0" value="${m.p2}"></div></div>`:""}
  <div class="grid" style="margin-top:10px"><div><label for="eDone">경기 상태</label><select id="eDone"><option value="0" ${m.done?"":"selected"}>예정</option><option value="1" ${m.done?"selected":""}>종료 (결과 반영)</option></select></div></div>
  <div class="btns"><button class="btn pri" id="saveM">저장</button><button class="btn" id="clrM">결과만 지우기</button><button class="btn dng" id="delM">경기 삭제</button></div></div>`;
  $("saveM").onclick=()=>{const c=S.matches.find(x=>x.id===m.id);c&&saveMatch(c)};
  $("clrM").onclick=()=>{const c=S.matches.find(x=>x.id===m.id);if(!c)return;c.s1=c.s2=c.p1=c.p2="";c.done=false;commit("결과를 지웠습니다.")};
  $("delM").onclick=()=>{if($("delM").dataset.s){S.matches=S.matches.filter(x=>x.id!==m.id);selId=null;commit("경기를 삭제했습니다.")}else{$("delM").dataset.s=1;$("delM").textContent="한 번 더 누르면 삭제"}};
}
function saveMatch(m){
  m.date=$("eDate").value||m.date;m.time=$("eTime").value.trim();m.place=$("ePlace").value.trim();m.grp=$("eGrp").value.trim()||m.grp;
  m.t1=$("eT1").value.trim();m.t2=$("eT2").value.trim();
  m.s1=$("eS1").value;m.s2=$("eS2").value;
  if($("eP1")){m.p1=$("eP1").value;m.p2=$("eP2").value}
  m.done=$("eDone").value==="1";
  if(m.done&&(!isNum(m.s1)||!isNum(m.s2))){m.done=false;toast("종료 처리하려면 두 팀의 득점을 모두 입력하세요.");return}
  if(m.done&&m.st==="k"&&+m.s1===+m.s2&&!(isNum(m.p1)&&isNum(m.p2)&&+m.p1!==+m.p2)){toast("토너먼트 동점입니다. 승부차기 점수를 입력하세요. 저장은 되었습니다.")}
  commit("저장했습니다.");
}
async function commit(msg){
  const ok=await persist();renderPub();refreshSel();renderEditor();renderPk();
  if(ok)modal("저장 완료",msg+" 모든 화면에 바로 반영됩니다.","ok");
}
function addMatch(){
  const l=$("fLg").value||selLg,n=Math.max(0,...S.matches.filter(m=>m.lg===l).map(m=>m.seq))+1;
  const x={id:l+"-"+n,lg:l,seq:n,st:"g",grp:Object.keys(lg(l).groups)[0],date:"2026-10-14",time:"12:50~13:10",place:"",t1:"",t2:"",s1:"",s2:"",p1:"",p2:"",done:false};
  S.matches.push(x);selId=x.id;saveUi();commit("새 경기를 추가했습니다. 내용을 입력해 저장하세요.");
}
function renderPk(){
  const box=$("pkBox");if(!box)return;let h="";
  LEAGUES.forEach(L=>Object.keys(L.groups).forEach(g=>{
    const t=table(L.id,g);if(!t.ties)return;
    const tied=t.rows.filter(r=>r.tie);
    h+=`<div class="card"><h2 style="margin-top:0">승부차기 순위 결정 <span class="tag">${L.name} ${g==="전체"?"":g+"조"}</span></h2>
    <p class="note" style="margin-top:0">승점·득실차·승자승이 같은 팀입니다. 승부차기 결과 순위(1이 가장 높음)를 입력하세요.</p>
    <div class="grid">${tied.map(r=>`<div><label>${esc(r.t)}</label><input type="number" min="1" data-pk="${esc(L.id+"|"+r.t)}" value="${esc(S.pkRank?.[L.id+"|"+r.t]??"")}"></div>`).join("")}</div>
    <div class="btns"><button class="btn pri" data-savepk>순위 저장</button></div></div>`;
  }));
  box.innerHTML=h;
}
$("adm").addEventListener("click",e=>{
  if(!e.target.matches("[data-savepk]"))return;
  S.pkRank=S.pkRank||{};
  e.target.closest(".card").querySelectorAll("[data-pk]").forEach(i=>{S.pkRank[i.dataset.pk]=i.value});
  commit("승부차기 순위를 저장했습니다.");
});

/* ============ 탭 / 시작 ============ */
function setTab(t){
  tab=t;saveUi();$("tabPub").setAttribute("aria-selected",t==="pub");$("tabAdm").setAttribute("aria-selected",t==="adm");
  $("pub").hidden=t!=="pub";$("adm").hidden=t!=="adm";
  if(t==="adm")renderAdm();
}
$("tabPub").onclick=()=>setTab("pub");$("tabAdm").onclick=()=>setTab("adm");

setSync();renderPub();setTab(tab);initFirebase();
